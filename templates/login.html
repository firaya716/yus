{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Вход в систему</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя:</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль:</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Войти</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрируйтесь</a></small>
                </div>
                <div class="mt-3 text-center">
                    <small><strong>Демо доступы:</strong><br>
                    Администратор: admin / admin123<br>
                    Мастер: master1 / master123<br>
                    Клиент: зарегистрируйтесь</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
